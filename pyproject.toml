[tool.poetry]
name = "enerbit-test"
version = "1.0.0"
description = "Service Order Management System - RESTful API for managing customers, service orders and data analysis"
authors = ["Jose Julian Mosquera Fuli"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Core Framework (upgraded for security fixes)
fastapi = ">=0.115.0"
uvicorn = ">=0.32.0"
starlette = ">=0.40.0"

# Database
sqlalchemy = ">=2.0.36"
psycopg2-binary = ">=2.9.10"
alembic = "^1.14.0"

# Redis
redis = ">=5.2.0"

# Validation and Settings
pydantic = ">=2.10.0"
pydantic-settings = ">=2.6.0"

# Configuration (fixed: symlink vulnerability >=1.0.1)
python-dotenv = ">=1.0.1"

# HTTP and Networking (idna fixed: DoS >=3.7)
httpx = ">=0.28.0"
idna = ">=3.10"

# Logging
python-json-logger = ">=3.2.0"

# Security and Rate Limiting
slowapi = ">=0.1.9"

# Data Analysis and Visualization (Pillow fixed: multiple vulns >=11.0.0)
pandas = ">=2.2.0"
numpy = ">=1.26.0,<3.0.0"
matplotlib = ">=3.9.0"
seaborn = ">=0.13.2"
Pillow = ">=11.0.0"
fonttools = ">=4.55.0"

[tool.poetry.group.dev.dependencies]
# Testing (pytest fixed: DoS >=8.0.0)
pytest = ">=8.3.0"
pytest-cov = ">=6.0.0"
pytest-asyncio = ">=0.24.0"
factory-boy = ">=3.3.0"
coverage = ">=7.6.0"

# Code Quality Tools (black fixed: vulns >=24.0.0)
isort = ">=5.13.0"
autoflake = ">=2.3.0"
pylint = ">=3.3.0"
black = ">=24.0.0"
mypy = ">=1.13.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --cov=. --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["database", "settings", "models", "schemas", "repositories", "routers"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pylint.master]
max-line-length = 88
disable = [
    "C0114",
    "C0115",
    "C0116",
    "R0903",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*",
    "alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
